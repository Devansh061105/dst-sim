name: Profile

# Run by hand: a CPU flamegraph of a one-thread chaos sweep. Needs Linux `perf`.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  flamegraph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install perf and cargo-flamegraph
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)"
          sudo sysctl kernel.perf_event_paranoid=-1
          cargo install flamegraph --locked
      - name: Flamegraph
        run: |
          cargo flamegraph --release -p dst-cli --bin dst -o flamegraph.svg -- \
            sweep --seeds 0..2000 --mode chaos --jobs 1
      - name: Top functions
        run: |
          perf report --stdio --no-children --sort symbol --percent-limit 0.5 > self.txt
          perf report --stdio --children --sort symbol --percent-limit 2 -g none > total.txt
          head -60 self.txt
          head -60 total.txt
      - uses: actions/upload-artifact@v4
        with:
          name: profile
          path: |
            flamegraph.svg
            self.txt
            total.txt
