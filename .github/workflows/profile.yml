name: Profile

# Run by hand: a CPU flamegraph of a one-thread chaos sweep. Needs Linux `perf`.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  flamegraph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install perf and cargo-flamegraph
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)"
          sudo sysctl kernel.perf_event_paranoid=-1
          cargo install flamegraph --locked
      # Frame pointers let perf walk the stack cheaply; DWARF unwinding lost most stacks.
      - name: Flamegraph
        env:
          RUSTFLAGS: -C force-frame-pointers=yes
        run: |
          cargo flamegraph --release -p dst-cli --bin dst -o flamegraph.svg \
            --cmd "record -F 1999 --call-graph fp -g" -- \
            sweep --seeds 0..5000 --mode chaos --jobs 1
      # Every frame's share of samples is in the SVG's tooltips.
      - uses: actions/upload-artifact@v4
        with:
          name: flamegraph
          path: flamegraph.svg
