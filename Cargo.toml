[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

# Internal crates, referenced by members as `sim-api = { workspace = true }`.
[workspace.dependencies]
sim-api = { path = "crates/sim-api" }
sim-core = { path = "crates/sim-core" }
sim-net = { path = "crates/sim-net" }
sim-disk = { path = "crates/sim-disk" }
checker = { path = "crates/checker" }
raft = { path = "crates/raft" }
kv = { path = "crates/kv" }

# External crates (keep this list short: disk space is limited).
rand_chacha = { version = "0.10", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

# Determinism lint: banned types/methods are listed in clippy.toml.
[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"

# Keep target/ small: line tables are enough for backtraces, and we never step through deps.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Line tables in release so flamegraphs show function names.
[profile.release]
debug = "line-tables-only"
